name: Release

# Two ways to trigger: creating a version branch, or pushing to one that already exists.
# `create` cannot be filtered by name, so the version pattern is enforced in the job.
on:
  create:
  push:
    branches: ['v*']

permissions:
  contents: write

# Both events for the same branch land in one group, so a create+push pair or a
# rerun serialises instead of racing. Not cancelling: a release run should finish.
concurrency:
  group: release-${{ github.event_name == 'create' && github.event.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CREATE_REF: ${{ github.event.ref }}
          CREATE_REF_TYPE: ${{ github.event.ref_type }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "create" ]; then
            ref_type="$CREATE_REF_TYPE"
            branch="$CREATE_REF"
          else
            ref_type="branch"
            branch="$PUSH_REF_NAME"
          fi

          # `create` also fires for tags; only branches make a release.
          if [ "$ref_type" != "branch" ]; then
            echo "::notice::Ref type is '$ref_type', not a branch. Skipping."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # v* also matches branches like `vendor-fix`, so validate before releasing.
          if ! [[ "$branch" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::Branch '$branch' is not vMAJOR.MINOR.PATCH. Skipping release."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "version=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout version branch
        if: steps.version.outputs.valid == 'true'
        uses: actions/checkout@v4
        with:
          # On `create` GITHUB_REF is not the new branch, so take it from the payload.
          ref: ${{ github.event_name == 'create' && github.event.ref || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Check for existing release
        id: exists
        if: steps.version.outputs.valid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION already exists. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.version.outputs.valid == 'true' && steps.exists.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Highest previous version tag reachable from HEAD, excluding the version being released.
          previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --merged HEAD --sort=-v:refname \
            | grep -vx "$VERSION" | head -n1 || true)"

          if [ -n "$previous" ]; then
            echo "## Changes since $previous" > release-notes.md
            range="$previous..HEAD"
          else
            echo "## Full commit history" > release-notes.md
            range="HEAD"
          fi

          echo "" >> release-notes.md
          git log "$range" --pretty=format:'- `%h` %s' >> release-notes.md
          echo "" >> release-notes.md
          cat release-notes.md

      - name: Create release
        if: steps.version.outputs.valid == 'true' && steps.exists.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          args=(--title "$VERSION" --notes-file release-notes.md)
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            # Tag already points somewhere; release it as-is instead of moving it.
            echo "::notice::Tag $VERSION already exists. Attaching release to it."
          else
            args+=(--target "$VERSION")
          fi
          gh release create "$VERSION" "${args[@]}"
