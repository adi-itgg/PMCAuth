name: Release

# Tags only. `v*` also matches things like `vendor-fix` or `v0.2.2-beta`,
# so the exact version shape is enforced in the job before anything is created.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# One group per tag, so a manual rerun of the same tag serialises instead of
# racing. Not cancelling: a release run should finish.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::Tag '$TAG' is not vMAJOR.MINOR.PATCH. Skipping release."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged commit
        if: steps.version.outputs.valid == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # All tags on the checkout, so the previous version can be found below.
          fetch-depth: 0
          fetch-tags: true

      - name: Check for existing release
        id: exists
        if: steps.version.outputs.valid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION already exists. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.version.outputs.valid == 'true' && steps.exists.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Highest previous version tag reachable from HEAD, excluding the tag being released.
          previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --merged HEAD --sort=-v:refname \
            | grep -vx "$VERSION" | head -n1 || true)"

          if [ -n "$previous" ]; then
            echo "## Changes since $previous" > release-notes.md
            range="$previous..HEAD"
          else
            echo "## Full commit history" > release-notes.md
            range="HEAD"
          fi

          echo "" >> release-notes.md
          git log "$range" --pretty=format:'- `%h` %s' >> release-notes.md
          echo "" >> release-notes.md
          cat release-notes.md

      - name: Create release
        if: steps.version.outputs.valid == 'true' && steps.exists.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # No --target: the tag is already created and points at the commit that
          # triggered this run. Passing it would only risk moving the ref.
          gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md
