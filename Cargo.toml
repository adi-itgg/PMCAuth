[package]
name = "pmc_auth"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# API crate + WIT definitions provided by the Pumpkin server.
#
# IMPORTANT — Pumpkin ships two plugin ABIs:
#   v0.1  package pumpkin:plugin@0.1.0  synchronous exports
#   v0.2  package pumpkin:plugin@0.2.0  async exports
#
# The host picks one from the exported interface name baked into the .wasm --
# `pumpkin:plugin/metadata@X.Y.Z`, not the package line:
#     if version.starts_with("0.1.") { V0_1 } else if "0.2." { V0_2 }
# and then type-checks every export against its own WIT for that version.
#
# That type check is why the pin must match the *server build*, not just the
# major version. `+26.3-26.60` is build metadata Cargo ignores, but the server
# generates its v0.1 linker from its own tree, and the WIT drifted between
# 26.51 and 26.60: commit f2cff8e6 ("feat(bedrock): port protocol to 1.26.60")
# added `hand`, `has-passenger-block-data` and `editor-level-migration-version`
# to records in bedrock-packets.wit. Those reach the `event` type through
# packet-received-event-data -> serverbound-packet -> s-animate, changing the
# type hash. The result is a mismatch reported at the first export that takes
# an `event`:
#   "Plugin was built against a different iteration of the API:
#    type-checking export func `handle-event`"
# (Not a v0.2-async symptom, despite the identical wording.)
#
# Pinned to the rev whose v0.1 WIT is byte-identical to the deployed server's
# `crates/pumpkin-plugin-wit/v0.1`. That server is the adi-itgg/PumpkinMC fork,
# and its bedrock-packets.wit LACKS five fields that upstream 26.60 added
# (`hand` on s-animate/s-player-auth-input, `has-passenger-block-data` twice,
# `editor-level-migration-version`). Those reach the `event` type through
# packet-received-event-data -> serverbound-packet -> s-animate, so the type
# hash changes and the host reports:
#   "Plugin was built against a different iteration of the API:
#    type-checking export func `handle-event`"
# `6458950` matches that fork's v0.1 exactly (verified with `diff -rq` on all
# WIT files). It still ships forms.wit, `open-form`, and
# bedrock-form-response-event, so the Bedrock login form works.
#
# Do NOT bump this to upstream master without checking the deployed server's
# WIT. A newer pin loads fine against upstream builds and fails against this
# fork, with the identical message.
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "645895098fcea9fcfc6fb21445520491d364dcb0" }
tracing = "0.1"
# Config file (TOML) and user database (JSON) serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Format- and comment-preserving TOML editing, for config migration.
#
# Already in the tree: `toml` 0.8 depends on it (Cargo.lock), so this adds no
# crate to the binary -- it only makes the existing one a direct dependency.
toml_edit = "0.22"
# Argon2id. Pure Rust, so it cross-compiles to wasm32-wasip2 without a C toolchain.
argon2 = "0.6"

[profile.release]
lto = true
codegen-units = 1
# No `catch_unwind` and no panic-based control flow, so unwinding is dead weight.
panic = "abort"
strip = true
# `"s"` over `"z"`: Argon2 is the only CPU-bound loop and it is memory-bound.
opt-level = "s"
