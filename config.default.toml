# PMCAuth configuration.
# This file is written to <server>/plugins/data/PMCAuth/config.toml on first run.
# Delete it to regenerate, or edit and restart the server.
#
# Settings added by a newer plugin version are merged into this file on startup.
# Existing values are never overwritten, and comments are kept. The automatic
# merge only adds keys your file is missing; it never edits a value you wrote.
#
# Written by PMCAuth. Compared against the plugin's built-in version on start;
# a lower number triggers the merge described above. Leave it alone.
# @pmcauto
config_version = 1

[general]
# User database file, relative to the plugin data folder.
database_file = "users.json"
# Seconds a player has to /login or /register before being kicked.
login_timeout_seconds = 60
# Seconds between "please log in" reminders. 0 disables reminders.
reminder_interval_seconds = 10
# Minutes an IP address stays authenticated. 0 disables IP sessions entirely.
# WARNING: enable this only if you trust the players sharing an IP (NAT, VPN,
# families). Everyone behind that IP inherits the session.
session_minutes = 0
min_password_length = 6
max_password_length = 64
# Failed /login attempts before a temporary lockout.
# Also counts attempts that name an account which does not exist, so guessing
# random usernames cannot burn hashing time for free.
max_login_attempts = 3
# Lockout duration in seconds.
lockout_seconds = 300
# true  = kick the player when the login timeout expires.
# false = keep them frozen and keep re-sending the login prompt.
kick_on_timeout = true
# What a failed /login attempt counts against.
#
# "uuid" = per player connection. Correct on every deployment, and the default.
#          Weaker: reconnecting gets a fresh counter.
# "ip"   = additionally per client IP. Stronger, but ONLY valid when the server
#          sees real client IPs (direct connections, or Velocity/Vine forwarding).
#          Behind BungeeCord every player shares the proxy's IP, so "ip" would
#          lock out the whole server on the first typo. Leave it on "uuid" there.
rate_limit_scope = "uuid"

[argon2]
# Argon2id cost. Higher is safer but slower; hashing runs on the server's main
# thread, so raising these hurts login latency for everyone online.
memory_kib = 8192
iterations = 2
parallelism = 1

# Premium (Mojang-authenticated) login.
#
# The plugin NEVER calls the Mojang API. It only trusts a connection that the
# server, or a proxy you vouched for, already authenticated. Auto-login happens
# only when ALL of these hold: enabled, the account is linked, the linked UUID
# equals the connection UUID, and a trust anchor is active. Anything else falls
# back to the password flow.
#
# Default is off, which is exactly the 0.2.x behaviour.
[premium]
enabled = false
# Trust a profile this server authenticated itself.
# Requires networking.java.online_mode = true in the server's own pumpkin.toml.
trust_online_mode = true
# Trust a profile forwarded by an authenticating proxy (Velocity/Vine with
# signed forwarding and a shared secret). Pumpkin exposes no way to confirm
# forwarding is on, so this is your assertion. A forwarded profile must also
# carry a textures property, which a bare offline server never produces.
trust_forwarded_profile = false
# true  = each player must run /premium once to link their account.
# false = link automatically on join while an anchor holds.
require_claim = true
# Refuse /register for a name already premium-linked in this database.
# This is a local check; it does not ask Mojang whether the name exists there.
block_linked_names = true
# Require the textures property as evidence when relying on a forwarded profile.
# Turning this off weakens the only evidence available. Leave it on.
link_requires_textures = true
# Log the autologin decision for every join (link state, anchor, outcome).
log_decisions = false

# Messages are per language. Each player is answered in their own client
# language; anything without a translation falls back to English.
#
# Supported out of the box: en (default), id.
# Add a language by copying a block below, e.g. [messages.de], and translating
# the values. Only the keys you list are overridden -- the rest come from the
# built-in defaults, so deleting a line is safe.
#
# Placeholders: {min}, {max}, {seconds}
[messages.en]
register_prompt = "Please /register <password> <repeat_password>"
login_prompt = "Please /login <password>"
register_success = "Registration successful. Have fun!"
login_success = "Login successful. Have fun!"
# Deliberately identical to not_registered: never reveal whether an account exists.
login_failed = "Login failed."
not_registered = "Login failed."
already_registered = "That account is already registered."
already_logged_in = "You are already logged in."
not_logged_in = "You are not logged in."
password_too_short = "Password must be at least {min} characters."
password_too_long = "Password must be at most {max} characters."
password_mismatch = "Password confirmation does not match."
password_is_username = "Password must not be your username."
logout_success = "You have been logged out."
change_success = "Password changed successfully."
kicked_timeout = "Login timed out."
kicked_bruteforce = "Too many login attempts. Try again later."
reminder = "You are not logged in. {seconds} seconds left."
deny_generic = "Please log in before doing that."
admin_usage = "Usage: /authadmin <unregister|forcelogin|setpassword|premium> <player> [password]"
admin_player_offline = "Player not found."
admin_unknown_account = "Account not found."
admin_done = "Done."
internal_error = "Internal error. Contact an admin."
premium_login_success = "Premium login verified. Welcome back!"
premium_status_linked = "Premium login is enabled for this account ({uuid})."
premium_status_not_linked = "Premium login is not enabled for this account."
premium_link_success = "Premium login enabled for this account."
premium_link_already = "Premium login is already enabled for this account."
premium_unlink_success = "Premium login disabled. Use /login from now on."
premium_unlink_not_linked = "Premium login is not enabled for this account."
premium_unavailable = "Premium login is not available on this server. Ask an admin."
